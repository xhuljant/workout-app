<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Log</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card">
    <!-- Wordmark -->
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">&#9626;</span>
      <h1 class="brand-name">Workout Log</h1>
    </header>

    <!-- Switch between logging in and creating an account -->
    <div class="tabs" role="tablist" aria-label="Authentication mode">
      <button id="tab-login" class="tab is-active" type="button" role="tab">Log in</button>
      <button id="tab-register" class="tab" type="button" role="tab">Create account</button>
    </div>

    <!-- One form reused for both modes. The name row only shows when registering. -->
    <form id="auth-form" novalidate>
      <div class="field" id="name-field" hidden>
        <label for="display_name">Name</label>
        <input id="display_name" name="display_name" type="text" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required minlength="8" />
      </div>

      <p id="message" class="message" role="alert" aria-live="polite"></p>

      <button id="submit" class="submit" type="submit">Log in</button>
    </form>

    <!-- The home screen: shown after a successful login. -->
    <section id="home" class="home" hidden>
      <div class="home-head">
        <p class="home-greeting">Hi, <strong id="who"></strong></p>
        <button id="logout" class="ghost" type="button">Log out</button>
      </div>

      <button id="start-empty" class="action action--wide" type="button">Start empty workout</button>

      <div class="action-row">
        <button id="new-routine" class="action" type="button">New Routine</button>
        <button id="exercises" class="action" type="button">Exercises</button>
      </div>

      <!-- One button per routine, filled in by app.js. -->
      <div id="routine-list" class="routine-list"></div>

      <!-- Shown instead of the list while the user has no routines yet. -->
      <p id="routine-empty" class="routine-empty" hidden>
        No routines yet. Create a custom routine to get started.
      </p>
    </section>

    <!-- Exercise library: shown when "Exercises" is tapped on the home screen. -->
    <section id="exercises-view" class="subview" hidden>
      <div class="subview-head">
        <button id="exercises-back" class="ghost" type="button">&larr; Back</button>
        <h2 class="subview-title">Exercises</h2>
      </div>

      <input id="exercise-search" class="search" type="search"
             placeholder="Search exercises" autocomplete="off" />

      <p id="exercise-status" class="exercise-status" aria-live="polite"></p>
      <div id="exercise-list" class="exercise-list"></div>

      <details id="add-exercise" class="add-exercise">
        <summary>Add an exercise</summary>
        <form id="add-exercise-form" novalidate>
          <div class="field">
            <label for="ex-name">Name</label>
            <input id="ex-name" name="name" type="text" required />
          </div>
          <div class="field">
            <label for="ex-category">Category <span class="opt">optional</span></label>
            <input id="ex-category" name="category" type="text" />
          </div>
          <div class="field">
            <label for="ex-equipment">Equipment <span class="opt">optional</span></label>
            <input id="ex-equipment" name="equipment" type="text" />
          </div>
          <div class="field">
            <label for="ex-muscles">Primary muscles <span class="opt">optional, comma-separated</span></label>
            <input id="ex-muscles" name="primary_muscles" type="text" />
          </div>
          <div class="field">
            <label for="ex-instructions">Instructions <span class="opt">optional, one step per line</span></label>
            <textarea id="ex-instructions" name="instructions" rows="3"></textarea>
          </div>
          <p id="add-exercise-message" class="message" role="alert" aria-live="polite"></p>
          <button id="add-exercise-submit" class="submit" type="submit">Add exercise</button>
        </form>
      </details>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
