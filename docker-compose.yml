# docker-compose for the workout app.
#
# Start everything with:   docker compose up --build
# Stop with Ctrl-C, then:  docker compose down
#
# NOTE: you should never need `down -v` any more. Schema changes are Alembic
# migrations now (they run automatically on `up`). `-v` DELETES THE DATABASE.
# Take a backup first with `make backup` if you ever really mean to.

services:
  # --- PostgreSQL database ---
  db:
    # Pinned to a patch tag for reproducible builds. A MAJOR bump (17, 18, ...)
    # is NOT a drop-in change -- it needs a dump/restore. See README "Upgrading".
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # A named volume keeps your data even when containers are rebuilt/removed.
      - workout_db_data:/var/lib/postgresql/data
    healthcheck:
      # The api service waits until this reports "healthy" before it starts.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- FastAPI backend (also serves the login page for now) ---
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      # Assembled from the Postgres values above. "db" is the hostname of the
      # database container on the internal docker network.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      # Password reset / outbound email. All optional -- safe defaults in
      # app/config.py. With SMTP_HOST unset, reset links are logged, not sent.
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Workout Log <no-reply@localhost>}
      SMTP_TLS: ${SMTP_TLS:-true}
    ports:
      # host:container -> open http://localhost:8000 in your browser.
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Hits /api/health, which does a real `SELECT 1`. A wedged API restarts.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Automated database backups ---
  # Every 24h: pg_dump -Fc into ./backups on the host, keeping 14 days. Restore
  # with `make restore FILE=backups/<name>.dump`. This is your safety net against
  # volume loss / an accidental `down -v`.
  db-backup:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RETENTION_DAYS: "14"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[db-backup] running; dumps -> /backups, retention $${RETENTION_DAYS}d"
        while true; do
          ts=$$(date +%Y-%m-%d-%H%M%S)
          out="/backups/workout-$${ts}.dump"
          if pg_dump -Fc -f "$${out}.part" && mv "$${out}.part" "$${out}"; then
            echo "[db-backup] wrote $${out}"
          else
            echo "[db-backup] dump FAILED at $${ts}" >&2
            rm -f "$${out}.part"
          fi
          find /backups -name 'workout-*.dump' -type f -mtime +$${RETENTION_DAYS} -delete
          sleep 86400
        done

volumes:
  workout_db_data:
